<div class="answer"><h2>答えの駅名を入力しよう！ 🚃</h2><p style="font-size:13px;margin:4px 0 12px">A〜Eの文字をヒントに考えよう。答えは漢字でもひらがなでもOK！</p><div class="entry"><input id="station" placeholder="駅名を入力" autocomplete="off" aria-label="駅名"><button class="action" id="check">答える</button></div><div class="result" id="result" aria-live="polite"></div></div>
<div class="bottom"><button id="clear" style="background:#fff;padding:10px 18px;border-radius:10px">クロスワードをリセット</button></div>
</section></main><script>
const intro=document.getElementById('intro'), puzzle=document.getElementById('puzzle');function advance(){intro.classList.remove('active');puzzle.classList.add('active');window.scrollTo(0,0)};
document.getElementById('introCover').onclick=advance;document.getElementById('start').onclick=advance;
document.getElementById('back').onclick=()=>{puzzle.classList.remove('active');intro.classList.add('active');window.scrollTo(0,0)};
const viewport=document.getElementById('viewport');document.getElementById('zoom').onclick=()=>{viewport.classList.toggle('zoom');document.getElementById('zoom').textContent=viewport.classList.contains('zoom')?'全体表示に戻す':'🔍 拡大して入力'};
// 各カギの入力はそのまま保持。対応するクロスワードのマスへ表示する。
const cells=[...document.querySelectorAll('.cell')];
const wordPositions={
  v1:[0,3,4,5,10],       // タテ①
  v2:[8,12,13],         // タテ②
  h1:[0,1,2],          // ヨコ①（Cはcell1）
  h2:[8,9,10,11],      // ヨコ②
  h3:[5,6,7]           // ヨコ③
};
const wordInputs=[...document.querySelectorAll('[data-word]')];
let editOrder=wordInputs.map(el=>el.dataset.word);
function removeDakuten(value){
  // 入力文字そのものには触れず、Cの表示だけ濁点 U+3099 を除く。
  return value.normalize('NFD').replace(/\u3099/g,'').normalize('NFC');
}
function renderCrossword(){
  const values=Array(cells.length).fill('');
  // 後から編集したカギの文字を優先して共通マスを表示する。
  for(const key of editOrder){
    const el=document.querySelector('[data-word="'+key+'"]');
    const positions=wordPositions[key];
    const chars=Array.from(el.value);
    positions.forEach((idx,i)=>{if(chars[i]) values[idx]=chars[i]});
  }
  cells.forEach((el,i)=>{el.textContent=i===1?removeDakuten(values[i]):values[i]});
}
wordInputs.forEach(el=>{
  el.addEventListener('input',()=>{
    const key=el.dataset.word;
    editOrder=editOrder.filter(k=>k!==key).concat(key);
    renderCrossword();
  });
});
function check(){const t=document.getElementById('station').value.normalize('NFKC').replace(/[\s　]/g,'').replace(/駅$/,'');const correct=['六本木','ろっぽんぎ','ロッポンギ'].includes(t);const out=document.getElementById('result');if(correct){out.className='result ok';out.textContent='🎉 正解！ もう1人の4年生を探しに六本木駅に行こう！ 🚃'}else{out.className='result error';out.textContent=t?'おしい！ ヒントをもう一度確認してみよう！':'駅名を入力してね！'}}
document.getElementById('check').onclick=check;
document.getElementById('station').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
document.getElementById('station').addEventListener('input',()=>{document.getElementById('result').textContent='' });
document.getElementById('clear').onclick=()=>{wordInputs.forEach(el=>el.value='');renderCrossword()};
renderCrossword();
</script></body></html>
