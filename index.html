<script>
const p1=document.getElementById('page1'),p2=document.getElementById('page2');
function showQuiz(){p1.classList.remove('active');p2.classList.add('active');window.scrollTo(0,0)}
document.getElementById('intro').addEventListener('click',showQuiz);document.getElementById('go').addEventListener('click',showQuiz);
document.getElementById('back').addEventListener('click',()=>{p2.classList.remove('active');p1.classList.add('active');window.scrollTo(0,0)});
const input=document.getElementById('station'),status=document.getElementById('status'),form=document.getElementById('quiz'),success=document.getElementById('success');
form.addEventListener('submit',e=>{e.preventDefault();const ans=input.value.normalize('NFKC').replace(/[\s　]/g,'').replace(/駅$/,'');if(ans==='六本木'){status.textContent='';form.classList.add('hidden');success.classList.add('show');input.blur();success.scrollIntoView({behavior:'smooth',block:'nearest'})}else if(!ans){status.textContent='駅名を入力してください。'}else{status.textContent='惜しい！ クロスワードのヒントをもう一度確認してみよう！'}});
document.getElementById('retry').addEventListener('click',()=>{input.value='';form.classList.remove('hidden');success.classList.remove('show');status.textContent='';input.focus()});
const modal=document.getElementById('modal');document.getElementById('zoom').onclick=()=>{modal.classList.add('open');document.body.style.overflow='hidden'};
function closeModal(){modal.classList.remove('open');document.body.style.overflow=''}
document.getElementById('close').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
