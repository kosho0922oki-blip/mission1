function removeDakuten(value){
  // 入力文字そのものには触れず、Cの表示だけ濁点 U+3099 を除く。
  return value.normalize('NFD').replace(/\u3099/g,'').normalize('NFC');
}
function renderCrossword(){
  const values=Array(cells.length).fill('');
  // 後から編集したカギの文字を優先して共通マスを表示する。
  for(const key of editOrder){
    const el=document.querySelector('[data-word="'+key+'"]');
    const positions=wordPositions[key];
    const chars=Array.from(el.value);
    positions.forEach((idx,i)=>{if(chars[i]) values[idx]=chars[i]});
  }
  cells.forEach((el,i)=>{el.textContent=i===1?removeDakuten(values[i]):values[i]});
}
wordInputs.forEach(el=>{
  el.addEventListener('input',()=>{
    const key=el.dataset.word;
    editOrder=editOrder.filter(k=>k!==key).concat(key);
    renderCrossword();
  });
});
function check(){const t=document.getElementById('station').value.normalize('NFKC').replace(/[\s　]/g,'').replace(/駅$/,'');const correct=['六本木','ろっぽんぎ','ロッポンギ'].includes(t);const out=document.getElementById('result');if(correct){out.className='result ok';out.textContent='🎉 正解！ 六本木駅！ では、もう1人の4年生を探しに行こう！ 🚃'}else{out.className='result error';out.textContent=t?'おしい！ ヒントをもう一度確認してみよう！':'駅名を入力してね！'}}
document.getElementById('check').onclick=check;
document.getElementById('station').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
document.getElementById('station').addEventListener('input',()=>{document.getElementById('result').textContent='' });
document.getElementById('clear').onclick=()=>{wordInputs.forEach(el=>el.value='');renderCrossword()};
renderCrossword();
</script></body></html>
